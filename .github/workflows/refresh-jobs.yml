name: refresh jobs board

on:
  schedule:
    # Daily ~06:07 UTC — Mon/Wed/Fri alone left 3-day gaps when GitHub drops
    # scheduled runs; daily is cheap (~20s, commit only on change) and keeps
    # "refreshed" aligned with the newest ATS postings.
    - cron: '7 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pull live postings from ATS APIs
        working-directory: tests
        run: node build-jobs.mjs

      # the jobs board writes jobs/sitemap-urls.json but only build-pages folds
      # it into sitemap.xml — without this, the sitemap lags the board by a day
      # (this cron runs at 06:07, the daily rebuild at 05:41) and any human
      # push in between fails CI's reproducibility check on the drift.
      - name: fold the new job pages into the sitemap
        working-directory: tests
        run: node build-pages.mjs > /dev/null

      - name: commit & push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage everything the builders touched, not just jobs/: build-pages
          # (added above so the sitemap never lags the board) rewrites
          # sitemap.xml with the new job URLs, and leaving that unstaged made
          # `git pull --rebase` abort with "you have unstaged changes" — the
          # cron failed every run for two days before this was caught.
          git add -A
          if git diff --cached --quiet; then
            echo "no changes — board already fresh"
          else
            git commit -m "chore: weekly jobs board refresh ($(date -u +%F))"
            # commit before rebasing: the build leaves files dirty, and another
            # cron may have pushed since checkout
            git pull --rebase origin main
            git push
          fi
