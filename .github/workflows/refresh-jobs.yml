name: refresh jobs board

on:
  schedule:
    # Daily ~06:07 UTC — Mon/Wed/Fri alone left 3-day gaps when GitHub drops
    # scheduled runs; daily is cheap (~20s, commit only on change) and keeps
    # "refreshed" aligned with the newest ATS postings.
    - cron: '7 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pull live postings from ATS APIs
        working-directory: tests
        run: node build-jobs.mjs

      - name: commit & push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/
          if git diff --cached --quiet; then
            echo "no changes — board already fresh"
          else
            git commit -m "chore: weekly jobs board refresh ($(date -u +%F))"
            # commit before rebasing: the build leaves files dirty, and another
            # cron may have pushed since checkout
            git pull --rebase origin main
            git push
          fi
