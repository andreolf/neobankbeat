name: cron health check

on:
  schedule:
    # Tuesday ~09:13 UTC — the morning after all three Monday crons have run,
    # and after the same day's 07:45 flowtest, which is now one of the things
    # checked below. At the old 07:13 this ran first and would have reported
    # that day's verification missing every single week.
    - cron: '13 9 * * 2'
  workflow_dispatch: {}

permissions:
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: verify every scheduled workflow ran recently and succeeded
        run: |
          set -euo pipefail
          # workflow file : max age of the last completed run, in days [ : event ].
          # rebuild.yml is checked on run age, not on commits: it is a no-op on
          # almost every day by design, and its job is to be there on the one day
          # a scheduled post is due. Silently disabled, posts never self-publish.
          #
          # test.yml carries the optional third field. It also runs on every push,
          # so its newest run is always fresh no matter what the schedule does —
          # filtering to event=schedule is the only way to see the daily
          # cron-verification run stop. Which is the failure that started all
          # this: a check that quietly stops running looks just like one passing.
          checks="refresh-news.yml:8 refresh-jobs.yml:2 discover-neobanks.yml:8 rebuild.yml:2 test.yml:2:schedule"
          problems=""
          for c in $checks; do
            wf="${c%%:*}"; rest="${c#*:}"
            case "$c" in
              *:*:*) max_days="${rest%%:*}"; query="&event=${rest##*:}" ;;
              *)     max_days="$rest";      query="" ;;
            esac
            run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?status=completed&per_page=1$query" \
              --jq '.workflow_runs[0] | if . == null then "none" else .conclusion + " " + .updated_at + " " + .html_url end')
            if [ "$run" = "none" ]; then
              problems="$problems- **$wf**: no completed runs found\n"
              continue
            fi
            conclusion=$(echo "$run" | cut -d' ' -f1)
            updated=$(echo "$run" | cut -d' ' -f2)
            url=$(echo "$run" | cut -d' ' -f3)
            age_days=$(( ( $(date -u +%s) - $(date -u -d "$updated" +%s) ) / 86400 ))
            if [ "$conclusion" != "success" ]; then
              problems="$problems- **$wf**: last run concluded \`$conclusion\` — $url\n"
            elif [ "$age_days" -gt "$max_days" ]; then
              problems="$problems- **$wf**: last successful run is ${age_days}d old (expected <${max_days}d) — the schedule may have been disabled by GitHub after 60 days of repo inactivity. $url\n"
            else
              echo "ok: $wf ($conclusion, ${age_days}d ago)"
            fi
          done
          if [ -z "$problems" ]; then
            echo "all crons healthy"
            exit 0
          fi
          # @-mention the owner: an issue on a repo you aren't watching notifies
          # nobody, which is how the Jul-2026 news outage went unseen for 11 days.
          # A mention always triggers a "participating" notification + email.
          body=$(printf "@andreolf — the weekly cron health check found problems:\n\n$problems\nRe-run the workflow manually from the Actions tab once fixed; this issue can then be closed.")
          existing=$(gh issue list --repo "$REPO" --state open --search "cron health in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --repo "$REPO" --title "cron health: scheduled workflow needs attention" --body "$body" --assignee andreolf
          fi
          exit 1
